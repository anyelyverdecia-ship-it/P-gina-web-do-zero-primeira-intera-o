<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #b8fdff;
            color: #8F7814;
            text-align: center;
            max-width: 830px;
            margin: 0 auto;
            border: 4px solid #8F7814;
            padding: 16px;
        }

        main {
            background-color: #f7e9ae;
            color: #8F7814;
            max-width: 800px;
            margin: 20px auto;
            border: 2px solid #f3dc77;
            padding: 16px;
        }

        article {
            display: flex;
            gap: 16px;
            text-align: left;
            margin-bottom: 24px;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }

        .artigo-autor {
            font-weight: bold;
        }

        button {
            cursor: pointer;
            background-color: #ffffff;
            border: 1px solid #8F7814;
            border-radius: 4px;
            padding: 4px 8px;
            margin-right: 4px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Blog.da.Anyi</h1>
        <p>Perfil para falar as maravilhas sobre Cuba</p>
    </header>

    <main>
        <article>
            <img src="praia22.jpeg"
                alt="Ilustração de uma praia.">
            <div>
                <h2>Meu Primeiro Post</h2>
                <p class="artigo-autor">Por: Anyely Verdecia</p>
                <p>Hola, aqui vamos falar sobre a 
                    cultura cubana e seus encantos!
                </p>
                <button>❤️ <span>0</span></button>
                <button>💬 <span>0</span></button>
                <button>🔁 <span>0</span></button>
            </div>
        </article>

        <article>
            <img src="pizza.jpeg"
                alt="imagem de uma pizza.">
            <div>
                <h2>Meu Segundo Post</h2>
                <p class="artigo-autor">Por: Anyely Verdecia</p>
                <p>Hola pessoal, fiquem atentos pois no 
                    próximo post, vou trazer uma deliciosa
                receita cubana! </p>
                <button>❤️ <span>0</span></button>
                <button>💬 <span>0</span></button>
                <button>🔁 <span>0</span></button>
            </div>
        </article>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            let curtiu = false;

            botao.addEventListener("click", function () {
                let texto = botao.querySelector("span");
               
                if (curtiu === false) {
                    texto.textContent = Number(texto.textContent) + 1;
                    curtiu = true;
                } else {
                    texto.textContent = Number(texto.textContent) - 1;
                    curtiu = false;
                }
            });
        });
    </script>
</body>

</html>
